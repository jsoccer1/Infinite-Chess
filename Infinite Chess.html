<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infinite Chess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --font: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --bg: #e6e7ec; --surface: #f5f5f8; --ink: #15161b; --muted: #5c5f6b; --hair: #cdcfd8;
  --cell-light: #ebebe3; --cell-dark: #1b1b1b; --rim: #6b6e7a; --label: #e0322f;
  --accent: #1f8fe0; --accent-ink: #ffffff;
  --danger: rgba(224, 50, 47, 0.7); --last: rgba(31, 143, 224, 0.38);
  --pass: #2f7d4f; --fail: #c0392b;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1b1c22; --surface: #282830; --ink: #e8e9ee; --muted: #9a9cab; --hair: #3a3b46;
    --rim: #8a8c99; --pass: #6fcf97; --fail: #ff7a6b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1b1c22; --surface: #282830; --ink: #e8e9ee; --muted: #9a9cab; --hair: #3a3b46;
  --rim: #8a8c99; --pass: #6fcf97; --fail: #ff7a6b;
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font); }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 24px; padding: 20px clamp(16px, 3vw, 36px) 14px; }
h1 { margin: 0; line-height: 0; }
.banner { display: block; width: 100%; max-width: 420px; height: auto; border-radius: 6px; }
.byline { margin: 8px 0 0; font-size: 15px; font-weight: 500; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#loader { position: fixed; inset: 0; z-index: 40; background: #050608; display: grid; place-items: center; padding: 24px; transition: opacity 0.35s ease; }
#loader.done { opacity: 0; }
.loader-inner { width: min(560px, 100%); display: flex; flex-direction: column; gap: 18px; }
.loader-inner img { width: 100%; height: auto; display: block; }
#loader-track { height: 6px; background: #1d2230; border-radius: 3px; overflow: hidden; }
#loader-bar { height: 100%; width: 0; background: linear-gradient(90deg, #1f8fe0, #5cc4ff); transition: width 0.25s ease-out; }
.loader-row { display: flex; justify-content: space-between; color: #9fb6cc; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { #loader, #loader-bar { transition: none; } }

main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: auto 1fr; grid-template-areas: "stage brand" "stage side"; gap: 18px 20px; padding: 20px clamp(16px, 3vw, 36px) 28px; align-items: start; }
.brand { grid-area: brand; }
.stage { grid-area: stage; }
aside { grid-area: side; }
.howto { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 7px 14px 7px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--hair); color: var(--ink); font-weight: 600; text-decoration: none; }
.howto:hover { border-color: var(--accent); }
.howto .play { width: 22px; height: 16px; border-radius: 4px; background: #e0322f; position: relative; flex: none; }
.howto .play::after { content: ""; position: absolute; left: 8px; top: 4px; border-style: solid; border-width: 4px 0 4px 7px; border-color: transparent transparent transparent #fff; }
.stage { background: var(--surface); border-radius: 18px; padding: 10px; min-width: 0; }
.board-wrap { width: 100%; display: flex; justify-content: center; }
canvas { display: block; touch-action: manipulation; }
.hover { height: 20px; text-align: center; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }

aside { display: flex; flex-direction: column; gap: 18px; }
.panel { display: flex; flex-direction: column; gap: 18px; }
.block h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.status { display: flex; gap: 12px; align-items: flex-start; }
.chip { flex: none; width: 22px; height: 22px; border-radius: 50%; margin-top: 3px; border: 2px solid var(--ink); }
.chip.w { background: #fbf7ee; } .chip.b { background: #1f2421; border-color: var(--rim); } .chip.over { background: var(--accent); border-color: var(--accent); }
#status { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; }
#status-sub { margin: 2px 0 0; color: var(--muted); min-height: 1.5em; }
#status-sub.alert { color: var(--fail); font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--hair); background: var(--surface); padding: 7px 13px; border-radius: 10px; cursor: pointer; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
label.check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
label.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.field { display: grid; grid-template-columns: 90px 1fr; align-items: center; gap: 8px; }
.field + .field { margin-top: 8px; }
.field label { color: var(--muted); }
select { background: var(--surface); border: 1px solid var(--hair); border-radius: 8px; padding: 6px 8px; }
.glyph { font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", "Noto Sans Symbols", "DejaVu Sans", "Apple Symbols", serif; font-size: 22px; line-height: 1; }
.glyph.w { color: #fbf7ee; -webkit-text-stroke: 1px #1a1d1b; paint-order: stroke fill; }
.glyph.b { color: #1f2421; -webkit-text-stroke: 1px #c9c2b0; paint-order: stroke fill; }
.caprow { display: flex; align-items: center; gap: 10px; min-height: 28px; }
.caprow > span:first-child { width: 48px; color: var(--muted); font-size: 13px; }
.caprow .list { display: flex; flex-wrap: wrap; gap: 1px; }
.muted { color: var(--muted); }
#moves { margin: 0; padding: 0 0 0 2.2em; max-height: 240px; overflow-y: auto; font-variant-numeric: tabular-nums; }
#moves li { padding: 2px 0; }
#moves li::marker { color: var(--muted); }
#moves li span { display: inline-block; min-width: 7.2em; }
.legend p { margin: 0 0 4px; }
.irow { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; }
.irow p { margin: 2px 0 0; font-variant-numeric: tabular-nums; }
.sw { flex: none; width: 14px; height: 14px; border-radius: 4px; margin-top: 4px; }
.sw.ortho { background: var(--ortho); } .sw.diag { background: var(--diag); } .sw.leap { background: var(--leap); }
.big { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
.path { margin: 8px 0 0; font-weight: 500; font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); margin: 0; }

.overlay { position: fixed; inset: 0; background: rgba(10, 14, 12, 0.55); display: grid; place-items: center; z-index: 20; padding: 16px; }
.dialog { background: var(--surface); color: var(--ink); border-radius: 16px; padding: 20px; max-width: 420px; width: 100%; }
.dialog h2 { margin: 0 0 14px; font-size: 18px; }
.promo-choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.promo-choices button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; border-radius: 12px; border: 1px solid var(--hair); background: var(--bg); cursor: pointer; font-size: 13px; }
.promo-choices button:hover { border-color: var(--accent); }
.promo-choices .glyph { font-size: 38px; }
#tests .dialog { max-width: 820px; max-height: 88vh; overflow-y: auto; }
#tests h3 { font-size: 15px; margin: 18px 0 6px; display: flex; justify-content: space-between; gap: 10px; }
#tests ul { list-style: none; margin: 0; padding: 0; }
#tests li { padding: 3px 0; border-bottom: 1px solid var(--hair); font-variant-numeric: tabular-nums; }
#tests li b { display: inline-block; width: 4.6em; }
#tests small { display: block; color: var(--muted); padding-left: 4.6em; word-break: break-word; }
.pass, .pass b { color: var(--pass); } .fail, .fail b { color: var(--fail); } .pending b { color: var(--accent); }
#tests li.pass { color: var(--ink); } #tests li.fail { color: var(--fail); }
#tests-summary { font-weight: 600; margin: 0; }

@media (max-width: 860px) {
  main { grid-template-columns: 1fr; grid-template-rows: none; grid-template-areas: "brand" "stage" "side"; }
  .stage { padding: 6px; border-radius: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>
// ================= MODULE 1: BoardGraph (pure data, no drawing) =================
const BoardGraph = (() => {
  const LANES = ['Q', 'B', 'N', 'R'];
  const ORTHOGONAL = [{ dc: 1, dt: 0 }, { dc: -1, dt: 0 }, { dc: 0, dt: 1 }, { dc: 0, dt: -1 }];
  const DIAGONAL = [{ dc: 1, dt: 1 }, { dc: 1, dt: -1 }, { dc: -1, dt: 1 }, { dc: -1, dt: -1 }];

  function wrapT(t) { return ((t - 1) % 22 + 22) % 22 + 1; }
  function inCrossing(t) { return (t >= 8 && t <= 11) || (t >= 19 && t <= 22); }

  function cellAt(c, t) {
    if (typeof c === 'object') { t = c.t; c = c.c; }
    if (t <= 18) return LANES[c] + t;
    return LANES[t - 19] + (11 - c);
  }

  function positionsOf(name) {
    const lane = LANES.indexOf(name[0]);
    const n = parseInt(name.slice(1), 10);
    const list = [{ c: lane, t: n, frame: 1 }];
    if (n >= 8 && n <= 11) list.push({ c: 11 - n, t: 19 + lane, frame: 2 });
    return list;
  }

  function otherFrame(pos, dir) {
    if (pos.t >= 8 && pos.t <= 11) {
      return { pos: { c: 11 - pos.t, t: 19 + pos.c }, dir: { dc: -dir.dt, dt: dir.dc } };
    }
    return { pos: { c: pos.t - 19, t: 11 - pos.c }, dir: { dc: dir.dt, dt: -dir.dc } };
  }

  function step(pos, dir) {
    let c2 = pos.c + dir.dc;
    if (c2 >= 0 && c2 <= 3) return { pos: { c: c2, t: wrapT(pos.t + dir.dt) }, dir };
    if (inCrossing(pos.t)) {
      const o = otherFrame(pos, dir);
      c2 = o.pos.c + o.dir.dc;
      if (c2 >= 0 && c2 <= 3) return { pos: { c: c2, t: wrapT(o.pos.t + o.dir.dt) }, dir: o.dir };
    }
    return null;
  }

  const ALL_CELLS = [];
  for (const L of LANES) for (let n = 1; n <= 18; n++) ALL_CELLS.push(L + n);

  function neighbors(name, dirs) {
    const s = new Set();
    for (const p of positionsOf(name)) for (const d of dirs) {
      const r = step(p, d);
      if (r) { const n = cellAt(r.pos); if (n !== name) s.add(n); }
    }
    return s;
  }
  const orthogonalNeighbors = (name) => neighbors(name, ORTHOGONAL);
  const diagonalNeighbors = (name) => neighbors(name, DIAGONAL);

  function walkLine(name, startPos, dir, isBlocked) {
    const out = [];
    let pos = startPos, d = dir;
    for (let i = 0; i < 100; i++) {
      const r = step(pos, d);
      if (!r) break;
      const n = cellAt(r.pos);
      if (n === name) break;
      out.push(n);
      if (isBlocked && isBlocked(n)) break;
      pos = r.pos; d = r.dir;
    }
    return out;
  }

  function linesFrom(name, dirs, isBlocked) {
    const res = [], seen = new Set();
    for (const p of positionsOf(name)) for (const d of dirs) {
      const path = walkLine(name, p, d, isBlocked);
      if (!path.length) continue;
      const k = path.join(',');
      if (seen.has(k)) continue;
      seen.add(k); res.push(path);
    }
    return res;
  }

  function leaperTargets(name) {
    const s = new Set();
    for (const P of positionsOf(name)) {
      for (const D of ORTHOGONAL) {
        const m = step(P, D); if (!m) continue;
        const D2 = m.dir;
        for (const S of [{ dc: D2.dt, dt: -D2.dc }, { dc: -D2.dt, dt: D2.dc }]) {
          const r = step(m.pos, { dc: D2.dc + S.dc, dt: D2.dt + S.dt });
          if (r) s.add(cellAt(r.pos));
        }
      }
      for (const D of DIAGONAL) {
        const m = step(P, D); if (!m) continue;
        const D2 = m.dir;
        for (const O of [{ dc: D2.dc, dt: 0 }, { dc: 0, dt: D2.dt }]) {
          const r = step(m.pos, O);
          if (r) s.add(cellAt(r.pos));
        }
      }
    }
    s.delete(name);
    return s;
  }

  function cellKey(name) { return LANES.indexOf(name[0]) * 100 + parseInt(name.slice(1), 10); }
  function sortCells(arr) { return [...arr].sort((a, b) => cellKey(a) - cellKey(b)); }

  return { LANES, ORTHOGONAL, DIAGONAL, wrapT, inCrossing, cellAt, positionsOf, otherFrame, step,
    ALL_CELLS, neighbors, orthogonalNeighbors, diagonalNeighbors, walkLine, linesFrom, leaperTargets, sortCells };
})();

// ================= MODULE 2: Geometry (board units, y up) =================
const Geometry = (() => {
  // Proportions follow the reference board: four equal rings that run all the way into the
  // centre point, so every ring boundary meets a crossing grid line exactly (R7 lines up with R8,
  // Q7 with Q8). The centre is a small almond-shaped hole, not a circle.
  const R4 = 4.6, W = R4 / 4, R0 = 0, D = R4 / Math.SQRT2;
  const HOLE_W = 0.6, HOLE_H = 0.3;                                    // half-width, half-height of the almond
  const HOLE_RHO = (HOLE_W * HOLE_W + HOLE_H * HOLE_H) / (2 * HOLE_H);  // radius of each of its two arcs
  const HOLE_OFF = HOLE_RHO - HOLE_H;
  const CL = { x: -D, y: 0 }, CR = { x: D, y: 0 };
  const SEC = 270 / 7, M = R0 / R4, DEG = Math.PI / 180;
  const LEFT_RING = { R: 0, N: 1, B: 2, Q: 3 };
  const RIGHT_RING = { Q: 0, B: 1, N: 2, R: 3 };
  const CROSS_V = { R: 0, N: 1, B: 2, Q: 3 };
  const BOARD_W = 2 * D + 2 * R4, BOARD_H = 2 * R4;

  function point(a, b) { return { x: CL.x + (a + b) / Math.SQRT2, y: (a - b) / Math.SQRT2 }; }
  // The crossing is a true 4x4 grid of equal squares, the same size as a ring width.
  const CELL = R4 / 4;
  const lineDef = (k) => ({ m: 0, c: k * CELL });
  function corner(k, j) {
    const A = lineDef(k), B = lineDef(j);
    const a = (A.c - A.m * B.c) / (1 - A.m * B.m);
    const b = B.c - B.m * a;
    return point(a, b);
  }
  function parse(name) { return { L: name[0], n: parseInt(name.slice(1), 10) }; }

  function shape(name) {
    const { L, n } = parse(name);
    if (n <= 7) {
      const k = LEFT_RING[L];
      return { kind: 'sector', c: CL, r1: R0 + k * W, r2: R0 + (k + 1) * W, a1: 315 - n * SEC, a2: 315 - (n - 1) * SEC };
    }
    if (n >= 12) {
      const k = RIGHT_RING[L];
      return { kind: 'sector', c: CR, r1: R0 + k * W, r2: R0 + (k + 1) * W, a1: 225 + (n - 12) * SEC, a2: 225 + (n - 11) * SEC };
    }
    const v = CROSS_V[L], u = n - 8;
    return { kind: 'quad', pts: [corner(v, u), corner(v + 1, u), corner(v + 1, u + 1), corner(v, u + 1)] };
  }

  function polygon(name) {
    const s = shape(name);
    if (s.kind === 'quad') return s.pts;
    const pts = [], N = 16;
    for (let i = 0; i < N; i++) { const a = (s.a1 + (s.a2 - s.a1) * i / (N - 1)) * DEG; pts.push({ x: s.c.x + s.r2 * Math.cos(a), y: s.c.y + s.r2 * Math.sin(a) }); }
    for (let i = N - 1; i >= 0; i--) { const a = (s.a1 + (s.a2 - s.a1) * i / (N - 1)) * DEG; pts.push({ x: s.c.x + s.r1 * Math.cos(a), y: s.c.y + s.r1 * Math.sin(a) }); }
    return pts;
  }

  // inner-ring wedges narrow to a point, so their centre sits further out
  const sectorMidR = (s) => (s.r1 === 0 ? 0.74 * W : (s.r1 + s.r2) / 2);
  function labelPos(name) {
    const s = shape(name);
    if (s.kind === 'sector') {
      const a = (s.a1 + s.a2) / 2 * DEG, r = sectorMidR(s);
      return { x: s.c.x + r * Math.cos(a), y: s.c.y + r * Math.sin(a) };
    }
    const p = s.pts;
    return { x: (p[0].x + p[1].x + p[2].x + p[3].x) / 4, y: (p[0].y + p[1].y + p[2].y + p[3].y) / 4 };
  }

  // approximate usable size of a cell (board units), used to scale pieces
  function cellSize(name) {
    const s = shape(name);
    if (s.kind === 'sector') {
      const rm = sectorMidR(s);
      return Math.min(W, rm * SEC * DEG);
    }
    const p = s.pts;
    let area = 0;
    for (let i = 0; i < 4; i++) { const a = p[i], b = p[(i + 1) % 4]; area += a.x * b.y - b.x * a.y; }
    return Math.sqrt(Math.abs(area) / 2);
  }

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const norm360 = (d) => ((d % 360) + 360) % 360;

  function holePoints(c) {
    const pts = [], a0 = Math.asin(HOLE_W / HOLE_RHO), N = 24;
    for (let i = 0; i <= N; i++) { const a = -a0 + 2 * a0 * i / N; pts.push({ x: c.x - HOLE_RHO * Math.sin(a), y: c.y - HOLE_OFF + HOLE_RHO * Math.cos(a) }); }
    for (let i = 0; i <= N; i++) { const a = -a0 + 2 * a0 * i / N; pts.push({ x: c.x + HOLE_RHO * Math.sin(a), y: c.y + HOLE_OFF - HOLE_RHO * Math.cos(a) }); }
    return pts;
  }
  function inHole(x, y) {
    for (const c of [CL, CR]) {
      if (Math.hypot(x - c.x, y - c.y + HOLE_OFF) <= HOLE_RHO && Math.hypot(x - c.x, y - c.y - HOLE_OFF) <= HOLE_RHO) return true;
    }
    return false;
  }

  function hitTest(x, y) {
    const dL = Math.hypot(x - CL.x, y - CL.y), dR = Math.hypot(x - CR.x, y - CR.y);
    if (inHole(x, y)) return null;
    const a = ((x - CL.x) + y) / Math.SQRT2, b = ((x - CL.x) - y) / Math.SQRT2;
    if (a >= 0 && a <= R4 && b >= 0 && b <= R4) {
      const v = clamp(Math.floor(a / CELL), 0, 3), u = clamp(Math.floor(b / CELL), 0, 3);
      return ['R', 'N', 'B', 'Q'][v] + (8 + u);
    }
    if (dL <= R4) {
      const theta = norm360(Math.atan2(y, x - CL.x) / DEG);
      const s = clamp(Math.floor((315 - theta) / SEC) + 1, 1, 7);
      const k = clamp(Math.floor(dL / W), 0, 3);
      return ['R', 'N', 'B', 'Q'][k] + s;
    }
    if (dR <= R4) {
      const theta = norm360(Math.atan2(y, x - CR.x) / DEG - 225);
      const s = clamp(12 + Math.floor(theta / SEC), 12, 18);
      const k = clamp(Math.floor(dR / W), 0, 3);
      return ['Q', 'B', 'N', 'R'][k] + s;
    }
    return null;
  }

  function shade(name) { return ('QBNR'.indexOf(name[0]) + parseInt(name.slice(1), 10)) % 2; }

  return { W, R0, R4, D, CL, CR, SEC, M, BOARD_W, BOARD_H, HOLE_W, point, shape, polygon, labelPos, cellSize, hitTest, shade, inHole, holePoints };
})();

// ================= MODULE 3: Rules (Phase 4 patterns + Phase 5 chess) =================
const Rules = (() => {
  const G = BoardGraph;
  const NAMES = G.ALL_CELLS;                      // index -> name
  const IDX = {}; NAMES.forEach((n, i) => (IDX[n] = i));
  const NUM = NAMES.map((n) => parseInt(n.slice(1), 10));
  const config = { BISHOP_MAX_STEPS: Infinity };

  // ---- precomputed empty-board patterns (all built from Phase 1 functions) ----
  const toIdx = (arr) => arr.map((n) => IDX[n]);
  const ORTHO_LINES = NAMES.map((n) => G.linesFrom(n, G.ORTHOGONAL).map(toIdx));
  const DIAG_LINES = NAMES.map((n) => G.linesFrom(n, G.DIAGONAL).map(toIdx));
  const ONE_STEP = NAMES.map((n) => toIdx([...new Set([...G.orthogonalNeighbors(n), ...G.diagonalNeighbors(n)])]));
  const LEAP = NAMES.map((n) => toIdx([...G.leaperTargets(n)]));

  // ---- RUNNER (pawn) ----
  function forwardDirs(color, name) {
    const n = parseInt(name.slice(1), 10);
    if (n >= 8 && n <= 11) return color === 'w' ? [{ dc: 0, dt: 1 }, { dc: -1, dt: 0 }] : [{ dc: 0, dt: -1 }, { dc: 1, dt: 0 }];
    const lowSide = (n >= 5 && n <= 7) || (n >= 12 && n <= 14);
    const plus = color === 'w' ? lowSide : !lowSide;
    return [{ dc: 0, dt: plus ? 1 : -1 }];
  }
  function pawnPattern(color, name) {
    const pos = G.positionsOf(name)[0];                // frame-1 position
    const adv = [], caps = new Set();
    for (const F of forwardDirs(color, name)) {
      const r1 = G.step(pos, F);
      if (r1) {
        const r2 = G.step(r1.pos, r1.dir);
        adv.push({ one: IDX[G.cellAt(r1.pos)], two: r2 ? IDX[G.cellAt(r2.pos)] : -1 });
      }
      for (const S of [{ dc: F.dt, dt: -F.dc }, { dc: -F.dt, dt: F.dc }]) {
        const r = G.step(pos, { dc: F.dc + S.dc, dt: F.dt + S.dt });
        if (r) { const c = G.cellAt(r.pos); if (c !== name) caps.add(IDX[c]); }
      }
    }
    return { adv, caps: [...caps] };
  }
  const PAWN = { w: NAMES.map((n) => pawnPattern('w', n)), b: NAMES.map((n) => pawnPattern('b', n)) };
  // reverse map: PAWN_ATTACKERS[color][target] = cells from which a pawn of `color` attacks target
  const PAWN_ATTACKERS = { w: NAMES.map(() => []), b: NAMES.map(() => []) };
  for (const c of ['w', 'b']) PAWN[c].forEach((p, i) => p.caps.forEach((t) => PAWN_ATTACKERS[c][t].push(i)));
  const isPromoCell = (color, i) => (color === 'w' ? NUM[i] === 15 : NUM[i] === 4);

  // distance (in pawn advances) to promotion, for the evaluator
  const PROMO_DIST = {};
  for (const c of ['w', 'b']) {
    const d = NAMES.map(() => Infinity);
    const q = [];
    NAMES.forEach((_, i) => { if (isPromoCell(c, i)) { d[i] = 0; q.push(i); } });
    const rev = NAMES.map(() => []);
    PAWN[c].forEach((p, i) => p.adv.forEach((a) => rev[a.one].push(i)));
    while (q.length) { const x = q.shift(); for (const y of rev[x]) if (d[y] === Infinity) { d[y] = d[x] + 1; q.push(y); } }
    PROMO_DIST[c] = d;
  }

  // ---- Phase 4 generic patterns on an occupancy (board[i] = {c:color} or null) ----
  function walkTargets(lines, from, board, color, maxSteps = Infinity) {
    const out = new Set();
    for (const path of lines[from]) {
      for (let k = 0; k < path.length && k < maxSteps; k++) {
        const j = path[k], p = board[j];
        if (!p) { out.add(j); continue; }
        if (p.c !== color) out.add(j);
        break;
      }
    }
    return out;
  }
  const Patterns = {
    ORTHO_LINE: (i, board, color) => walkTargets(ORTHO_LINES, i, board, color),
    DIAG_LINE: (i, board, color, max = Infinity) => walkTargets(DIAG_LINES, i, board, color, max),
    ANY_LINE: (i, board, color) => new Set([...walkTargets(ORTHO_LINES, i, board, color), ...walkTargets(DIAG_LINES, i, board, color)]),
    ONE_STEP: (i, board, color) => new Set(ONE_STEP[i].filter((j) => !board[j] || board[j].c !== color)),
    LEAP: (i, board, color) => new Set(LEAP[i].filter((j) => !board[j] || board[j].c !== color)),
    RUNNER: (i, board, color, firstMove) => {
      const out = new Set(), pp = PAWN[color][i];
      for (const a of pp.adv) {
        if (board[a.one]) continue;
        out.add(a.one);
        if (firstMove && a.two >= 0 && !board[a.two]) out.add(a.two);
      }
      for (const j of pp.caps) if (board[j] && board[j].c !== color) out.add(j);
      return out;
    },
  };

  // ---- Game state ----
  const VALUES = { P: 1, N: 3, B: 3, R: 5, Q: 9, K: 0 };
  const SETUP = {
    w: { K: ['Q4'], Q: ['Q5'], B: ['B4', 'B5'], N: ['N4', 'N5'], R: ['R4', 'R5'], P: ['Q3', 'B3', 'N3', 'R3', 'Q6', 'B6', 'N6', 'R6'] },
    b: { K: ['R14'], Q: ['R15'], B: ['N14', 'N15'], N: ['B14', 'B15'], R: ['Q14', 'Q15'], P: ['R13', 'N13', 'B13', 'Q13', 'R16', 'N16', 'B16', 'Q16'] },
  };
  const CASTLE = {
    w: { k: IDX.Q4, kTo: IDX.N4, r: IDX.R4, rTo: IDX.B4, between: [IDX.B4, IDX.N4], pass: [IDX.B4, IDX.N4] },
    b: { k: IDX.R14, kTo: IDX.B14, r: IDX.Q14, rTo: IDX.N14, between: [IDX.N14, IDX.B14], pass: [IDX.N14, IDX.B14] },
  };

  function newGame() {
    const board = new Array(72).fill(null);
    for (const c of ['w', 'b']) for (const t in SETUP[c]) for (const n of SETUP[c][t]) board[IDX[n]] = { t, c, moved: false };
    const s = { board, turn: 'w', history: [], posCounts: {} };
    s.posCounts[positionKey(s)] = 1;
    return s;
  }
  function emptyGame() { return { board: new Array(72).fill(null), turn: 'w', history: [], posCounts: {} }; }

  function findKing(s, color) { for (let i = 0; i < 72; i++) { const p = s.board[i]; if (p && p.t === 'K' && p.c === color) return i; } return -1; }

  // Is cell `T` attacked by pieces of color `by`? (reverse lookup from T; patterns are symmetric)
  function isAttacked(s, T, by) {
    const b = s.board;
    for (const j of LEAP[T]) { const p = b[j]; if (p && p.c === by && p.t === 'N') return true; }
    for (const j of ONE_STEP[T]) { const p = b[j]; if (p && p.c === by && p.t === 'K') return true; }
    for (const j of PAWN_ATTACKERS[by][T]) { const p = b[j]; if (p && p.c === by && p.t === 'P') return true; }
    for (const path of ORTHO_LINES[T]) for (const j of path) { const p = b[j]; if (!p) continue; if (p.c === by && (p.t === 'R' || p.t === 'Q')) return true; break; }
    for (const path of DIAG_LINES[T]) for (let k = 0; k < path.length; k++) {
      const p = b[path[k]]; if (!p) continue;
      if (p.c === by && (p.t === 'Q' || (p.t === 'B' && k < config.BISHOP_MAX_STEPS))) return true;
      break;
    }
    return false;
  }
  // forward attack set (used by tests to validate isAttacked)
  function attacksOf(s, i) {
    const p = s.board[i], b = s.board;
    switch (p.t) {
      case 'P': return new Set(PAWN[p.c][i].caps);
      case 'N': return new Set(LEAP[i]);
      case 'K': return new Set(ONE_STEP[i]);
      case 'R': return lineAttacks(ORTHO_LINES, i, b);
      case 'B': return lineAttacks(DIAG_LINES, i, b, config.BISHOP_MAX_STEPS);
      case 'Q': return new Set([...lineAttacks(ORTHO_LINES, i, b), ...lineAttacks(DIAG_LINES, i, b)]);
    }
    return new Set();
  }
  function lineAttacks(lines, i, b, max = Infinity) {
    const out = new Set();
    for (const path of lines[i]) for (let k = 0; k < path.length && k < max; k++) { out.add(path[k]); if (b[path[k]]) break; }
    return out;
  }
  const inCheck = (s, color) => { const k = findKing(s, color); return k >= 0 && isAttacked(s, k, color === 'w' ? 'b' : 'w'); };

  function pseudoMoves(s, color) {
    const moves = [], b = s.board;
    for (let i = 0; i < 72; i++) {
      const p = b[i]; if (!p || p.c !== color) continue;
      let targets;
      switch (p.t) {
        case 'R': targets = Patterns.ORTHO_LINE(i, b, color); break;
        case 'B': targets = Patterns.DIAG_LINE(i, b, color, config.BISHOP_MAX_STEPS); break;
        case 'Q': targets = Patterns.ANY_LINE(i, b, color); break;
        case 'K': targets = Patterns.ONE_STEP(i, b, color); break;
        case 'N': targets = Patterns.LEAP(i, b, color); break;
        case 'P': targets = Patterns.RUNNER(i, b, color, !p.moved); break;
      }
      for (const j of targets) {
        if (b[j] && b[j].t === 'K') continue; // kings are never captured (legal play prevents this anyway)
        if (p.t === 'P' && isPromoCell(color, j)) {
          for (const pr of ['Q', 'R', 'B', 'N']) moves.push({ from: i, to: j, promo: pr });
        } else moves.push({ from: i, to: j });
      }
      if (p.t === 'K' && !p.moved) {
        const C = CASTLE[color], r = b[C.r];
        if (i === C.k && r && r.t === 'R' && r.c === color && !r.moved && C.between.every((x) => !b[x]))
          moves.push({ from: i, to: C.kTo, castle: true });
      }
    }
    return moves;
  }

  function makeMove(s, m) {
    const b = s.board, p = b[m.from];
    const undo = { m, captured: b[m.to], movedBefore: p.moved, piece: p, rook: null, turn: s.turn };
    b[m.to] = m.promo ? { t: m.promo, c: p.c, moved: true } : p;
    b[m.from] = null;
    p.moved = true;
    if (m.castle) {
      const C = CASTLE[p.c], r = b[C.r];
      undo.rook = { piece: r, moved: r.moved };
      b[C.rTo] = r; b[C.r] = null; r.moved = true;
    }
    s.turn = s.turn === 'w' ? 'b' : 'w';
    return undo;
  }
  function unmakeMove(s, u) {
    const b = s.board, m = u.m;
    b[m.from] = u.piece; u.piece.moved = u.movedBefore;
    b[m.to] = u.captured;
    if (u.rook) { const C = CASTLE[u.piece.c]; b[C.r] = u.rook.piece; b[C.rTo] = null; u.rook.piece.moved = u.rook.moved; }
    s.turn = u.turn;
  }

  function legalMoves(s, color = s.turn) {
    const opp = color === 'w' ? 'b' : 'w';
    const out = [];
    for (const m of pseudoMoves(s, color)) {
      if (m.castle) {
        const C = CASTLE[color];
        if (isAttacked(s, C.k, opp) || C.pass.some((x) => isAttacked(s, x, opp))) continue;
      }
      const saveTurn = s.turn; s.turn = color;
      const u = makeMove(s, m);
      const ok = !inCheck(s, color);
      unmakeMove(s, u); s.turn = saveTurn;
      if (ok) out.push(m);
    }
    return out;
  }

  function positionKey(s) {
    let k = s.turn;
    for (let i = 0; i < 72; i++) { const p = s.board[i]; k += p ? (p.c === 'w' ? p.t : p.t.toLowerCase()) : '.'; }
    return k;
  }

  // Full move with bookkeeping (used by the UI and the AI-vs-AI test)
  function playMove(s, m) {
    const fromName = NAMES[m.from], toName = NAMES[m.to];
    const p = s.board[m.from];
    const u = makeMove(s, m);
    const key = positionKey(s);
    s.posCounts[key] = (s.posCounts[key] || 0) + 1;
    let note = m.castle ? `${fromName}-${toName} (castles)` : `${fromName}${u.captured ? 'x' : '-'}${toName}${m.promo ? '=' + m.promo : ''}`;
    s.history.push({ undo: u, key, note, piece: p.t, color: p.c, captured: u.captured });
    return u;
  }
  function undoLast(s) {
    const h = s.history.pop(); if (!h) return null;
    s.posCounts[h.key]--; if (!s.posCounts[h.key]) delete s.posCounts[h.key];
    unmakeMove(s, h.undo);
    return h;
  }

  function status(s) {
    const moves = legalMoves(s);
    const check = inCheck(s, s.turn);
    if (!moves.length) return check ? { over: true, result: 'checkmate', winner: s.turn === 'w' ? 'b' : 'w', check } : { over: true, result: 'stalemate', check };
    const last = s.history[s.history.length - 1];
    if (last && s.posCounts[last.key] >= 3) return { over: true, result: 'repetition', check };
    return { over: false, check, moves };
  }

  return { NAMES, IDX, NUM, config, Patterns, PAWN, PROMO_DIST, VALUES, ORTHO_LINES, DIAG_LINES, ONE_STEP, LEAP,
    newGame, emptyGame, findKing, isAttacked, attacksOf, inCheck, pseudoMoves, legalMoves, makeMove, unmakeMove,
    playMove, undoLast, status, isPromoCell, positionKey };
})();

// ================= MODULE 4: Computer opponent =================
const AI = (() => {
  const R = Rules;
  const MATE = 100000;

  function evaluate(s) {             // from White's point of view
    let score = 0;
    const b = s.board;
    for (let i = 0; i < 72; i++) {
      const p = b[i]; if (!p) continue;
      let v = R.VALUES[p.t];
      if (p.t === 'P') { const d = R.PROMO_DIST[p.c][i]; if (d < 30) v += Math.max(0, 12 - d) * 0.06; }
      score += p.c === 'w' ? v : -v;
    }
    score += 0.02 * (R.pseudoMoves(s, 'w').length - R.pseudoMoves(s, 'b').length);
    return score;
  }

  function order(s, moves) {
    const b = s.board;
    return moves.map((m) => ({ m, k: (b[m.to] ? 10 * R.VALUES[b[m.to].t] - R.VALUES[b[m.from].t] : 0) + (m.promo === 'Q' ? 8 : 0) }))
      .sort((a, b2) => b2.k - a.k).map((x) => x.m);
  }

  function negamax(s, depth, alpha, beta, ply) {
    const color = s.turn, sign = color === 'w' ? 1 : -1;
    const moves = R.legalMoves(s);
    if (!moves.length) return R.inCheck(s, color) ? -MATE + ply : 0;
    if (depth === 0) return sign * evaluate(s);
    let best = -Infinity;
    for (const m of order(s, moves)) {
      const u = R.makeMove(s, m);
      const v = -negamax(s, depth - 1, -beta, -alpha, ply + 1);
      R.unmakeMove(s, u);
      if (v > best) best = v;
      if (v > alpha) alpha = v;
      if (alpha >= beta) break;
    }
    return best;
  }

  // Returns the chosen move. Random tie-break among equally scored moves.
  function chooseMove(s, depth) {
    const moves = R.legalMoves(s);
    if (!moves.length) return null;
    for (let i = moves.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [moves[i], moves[j]] = [moves[j], moves[i]]; }
    const scored = [];
    let alpha = -Infinity;
    for (const m of order(s, moves)) {
      const u = R.makeMove(s, m);
      // full window at the root so ties are exact
      const v = -negamax(s, depth - 1, -Infinity, -alpha + 1e-9, 1);
      R.unmakeMove(s, u);
      scored.push({ m, v });
      if (v > alpha) alpha = v;
    }
    const best = Math.max(...scored.map((x) => x.v));
    const top = scored.filter((x) => x.v >= best - 1e-6);
    return top[Math.floor(Math.random() * top.length)].m;
  }

  return { evaluate, chooseMove };
})();

const PHASE3_CELLS = ['Q1','Q4','R7','R8','Q8','Q9','B10','N11','R11','Q11','Q12','Q18','R18','R12','R1'];

// ================= Test runner (open with #test) =================
const Tests = (() => {
  const G = BoardGraph, Ge = Geometry, R = Rules;
  const sortJoin = (it) => G.sortCells([...it]).join(' ');
  const normLines = (ls) => ls.map((l) => l.join(',')).sort().join(' | ');

  function parseA() {
    return APPENDIX_A.trim().split('\n').map((line) => {
      const [n, o, d, l] = line.split('|').map((s) => s.trim());
      return { n, o: o.split(/\s+/), d: d.split(/\s+/), l: l.split(/\s+/) };
    });
  }

  function pointInPoly(pt, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const a = poly[i], b = poly[j];
      if ((a.y > pt.y) !== (b.y > pt.y) && pt.x < ((b.x - a.x) * (pt.y - a.y)) / (b.y - a.y) + a.x) inside = !inside;
    }
    return inside;
  }

  // shared with the Line mode in the UI
  function lineModeLines(start, neighbor) {
    const out = [];
    for (const p of G.positionsOf(start)) for (const d of [...G.ORTHOGONAL, ...G.DIAGONAL]) {
      const r = G.step(p, d);
      if (r && G.cellAt(r.pos) === neighbor) {
        const path = G.walkLine(start, p, d);
        if (!out.some((x) => x.join() === path.join())) out.push(path);
      }
    }
    return out;
  }

  function syncTests() {
    const res = [];
    const add = (phase, name, pass, detail = '') => res.push({ phase, name, pass: !!pass, detail });

    // ---------- Phase 1 ----------
    const names = new Set();
    for (let c = 0; c < 4; c++) for (let t = 1; t <= 22; t++) names.add(G.cellAt(c, t));
    add(1, '88 strip positions map onto exactly 72 distinct names', names.size === 72 && G.ALL_CELLS.length === 72, `${names.size} names`);
    let rt = 0; for (const X of G.ALL_CELLS) for (const p of G.positionsOf(X)) if (G.cellAt(p) !== X) rt++;
    add(1, 'cellAt(positionsOf(X)) === X for every cell', rt === 0, `${rt} mismatches`);
    let asym = 0;
    for (const X of G.ALL_CELLS) {
      for (const Y of G.orthogonalNeighbors(X)) if (!G.orthogonalNeighbors(Y).has(X)) asym++;
      for (const Y of G.diagonalNeighbors(X)) if (!G.diagonalNeighbors(Y).has(X)) asym++;
      for (const Y of G.leaperTargets(X)) if (!G.leaperTargets(Y).has(X)) asym++;
    }
    add(1, 'Orthogonal, diagonal and leaper relations are symmetric', asym === 0, `${asym} asymmetric pairs`);
    let ov = 0;
    for (const X of G.ALL_CELLS) { const L = G.leaperTargets(X); for (const Y of [...G.orthogonalNeighbors(X), ...G.diagonalNeighbors(X)]) if (L.has(Y)) ov++; }
    add(1, 'No leaperTargets overlap orthogonal or diagonal neighbors', ov === 0, `${ov} overlaps`);
    const A = parseA();
    for (const row of A) {
      const ok = sortJoin(G.orthogonalNeighbors(row.n)) === sortJoin(row.o) && sortJoin(G.diagonalNeighbors(row.n)) === sortJoin(row.d) && sortJoin(G.leaperTargets(row.n)) === sortJoin(row.l);
      add(1, `Appendix A row ${row.n}`, ok, ok ? '' : `got ${sortJoin(G.orthogonalNeighbors(row.n))} | ${sortJoin(G.diagonalNeighbors(row.n))} | ${sortJoin(G.leaperTargets(row.n))}`);
    }
    for (const t of APPENDIX_B.laneLines) {
      const got = G.walkLine(t.from, G.positionsOf(t.from)[0], t.dir).join(' ');
      add(1, `Appendix B lane line from ${t.from} (0,+1)`, got === t.expect, got);
    }
    for (const t of APPENDIX_B.acrossLines) {
      const got = G.linesFrom(t.from, [{ dc: 1, dt: 0 }, { dc: -1, dt: 0 }]);
      add(1, `Appendix B lines across lanes from ${t.from}`, normLines(got) === normLines(t.expect), normLines(got));
    }
    for (const t of APPENDIX_B.diagLines) {
      const got = G.linesFrom(t.from, G.DIAGONAL);
      add(1, `Appendix B diagonal lines from ${t.from}`, normLines(got) === normLines(t.expect), normLines(got));
    }

    // ---------- Phase 2 ----------
    let clickFail = [];
    for (const n of G.ALL_CELLS) { const p = Ge.labelPos(n); if (Ge.hitTest(p.x, p.y) !== n) clickFail.push(n); }
    add(2, 'Clicking every label position returns that cell', clickFail.length === 0, clickFail.join(' '));
    const mid = []; let last = null;
    for (let x = -Ge.BOARD_W / 2 + 0.005; x < Ge.BOARD_W / 2; x += 0.01) {
      const h = Ge.hitTest(x, 0) || '(hole)';
      if (h !== last) { mid.push(h); last = h; }
    }
    const midStr = mid.join(' ');
    add(2, 'Horizontal midline reads Q4 B4 N4 R4 (hole) R8 N9 B10 Q11 (hole) Q15 B15 N15 R15', midStr === 'Q4 B4 N4 R4 (hole) R8 N9 B10 Q11 (hole) Q15 B15 N15 R15', midStr);
    const ringL = [0, 1, 2, 3].map((k) => Ge.hitTest(Ge.CL.x - (k + 0.7) * Ge.W, 0.0001)[0]).join('');
    const ringR = [0, 1, 2, 3].map((k) => Ge.hitTest(Ge.CR.x + (k + 0.7) * Ge.W, 0.0001)[0]).join('');
    add(2, 'Left loop rings inner to outer R N B Q; right loop Q B N R', ringL === 'RNBQ' && ringR === 'QBNR', `${ringL} / ${ringR}`);
    add(2, 'Q8 touches the top tip, R11 touches the bottom tip', Ge.hitTest(0, Ge.D - 0.02) === 'Q8' && Ge.hitTest(0, -Ge.D + 0.02) === 'R11');
    add(2, 'R8 touches the left hole, Q11 touches the right hole', Ge.hitTest(Ge.CL.x + Ge.HOLE_W + 0.02, 0) === 'R8' && Ge.hitTest(Ge.CR.x - Ge.HOLE_W - 0.02, 0) === 'Q11');
    { // ring boundaries meet the crossing grid lines on all four diamond edges
      let bad = 0;
      const edges = [[Ge.CL, 45, 1], [Ge.CL, 315, -1], [Ge.CR, 135, -1], [Ge.CR, 225, 1]]; // [centre, edge angle, which side is the loop]
      for (const [c, ang, loopSide] of edges) for (const k of [0, 1, 2, 3]) for (const off of [0.03, Ge.W / 2, Ge.W - 0.03]) {
        const r = k * Ge.W + off;
        if (r < Ge.HOLE_W + 0.05) continue;
        const at = (deg) => Ge.hitTest(c.x + r * Math.cos(deg * Math.PI / 180), c.y + r * Math.sin(deg * Math.PI / 180));
        const loop = at(ang + loopSide * 0.5), cross = at(ang - loopSide * 0.5);
        if (!loop || !cross || !G.orthogonalNeighbors(loop).has(cross)) bad++;   // each seam is a real orthogonal step
      }
      add(2, 'Every cell edge on the diamond seams meets the right neighbor exactly (R7 with R8, Q7 with Q8, N1 with R9)', bad === 0, `${bad} misaligned seam points`);
    }
    let same = 0; for (const n of G.ALL_CELLS) for (const m of G.orthogonalNeighbors(n)) if (Ge.shade(n) === Ge.shade(m)) same++;
    add(2, 'Checkerboard: no two edge-sharing cells have the same shade', same === 0, `${same} conflicts`);
    const polys = {}; for (const n of G.ALL_CELLS) polys[n] = Ge.polygon(n);
    let gaps = 0, overlaps = 0, wrong = 0, samples = 0;
    for (let x = -Ge.BOARD_W / 2; x < Ge.BOARD_W / 2; x += 0.0731) for (let y = -Ge.R4; y < Ge.R4; y += 0.0697) {
      const dL = Math.hypot(x - Ge.CL.x, y), dR = Math.hypot(x - Ge.CR.x, y);
      if (Ge.inHole(x, y) || Ge.inHole(x + 0.01, y) || Ge.inHole(x - 0.01, y) || Ge.inHole(x, y + 0.01) || Ge.inHole(x, y - 0.01)) continue;
      if (!(dL < Ge.R4 - 0.01 || dR < Ge.R4 - 0.01)) continue;
      // skip points within 0.01 of a ring arc: drawn arcs are 16-point chords (sagitta under 0.002)
      if ([1, 2, 3, 4].some((k) => Math.abs(dL - k * Ge.W) < 0.01 || Math.abs(dR - k * Ge.W) < 0.01)) continue;
      samples++;
      const inside = G.ALL_CELLS.filter((n) => pointInPoly({ x, y }, polys[n]));
      if (inside.length === 0) gaps++; else if (inside.length > 1) overlaps++;
      else if (Ge.hitTest(x, y) !== inside[0]) wrong++;
    }
    add(2, 'No gaps or overlaps between drawn cells; clicks agree with drawn shapes', gaps === 0 && overlaps === 0 && wrong === 0, `${samples} samples: ${gaps} gaps, ${overlaps} overlaps, ${wrong} click mismatches`);

    // ---------- Phase 3 ----------
    for (const c of PHASE3_CELLS) {
      const row = A.find((r) => r.n === c);
      const ok = sortJoin(G.orthogonalNeighbors(c)) === sortJoin(row.o) && sortJoin(G.diagonalNeighbors(c)) === sortJoin(row.d) && sortJoin(G.leaperTargets(c)) === sortJoin(row.l);
      add(3, `Inspector output for ${c}`, ok);
    }
    for (const t of APPENDIX_B.laneLines) {
      const exp = t.expect.split(' ');
      const got = lineModeLines(t.from, exp[0]);
      add(3, `Line mode ${t.from} then ${exp[0]}`, got.some((p) => p.join(' ') === t.expect));
    }
    for (const t of [...APPENDIX_B.acrossLines, ...APPENDIX_B.diagLines]) for (const exp of t.expect) {
      const got = lineModeLines(t.from, exp[0]);
      add(3, `Line mode ${t.from} then ${exp[0]}`, got.some((p) => p.join(' ') === exp.join(' ')), got.map((p) => p.join(' ')).join(' | '));
    }

    // ---------- Phase 4 ----------
    const r7 = G.walkLine('R7', G.positionsOf('R7')[0], { dc: 0, dt: 1 });
    add(4, 'A line arriving at R8 from R7 continues to R9', r7[0] === 'R8' && r7[1] === 'R9');
    for (const L of G.LANES) {
      const p = G.walkLine(L + '1', G.positionsOf(L + '1')[0], { dc: 0, dt: 1 });
      add(4, `Lane ${L} is one loop of 22 steps`, p.length === 21, `${p.length + 1} steps`);
    }
    const allDiag = G.ALL_CELLS.every((n) => !G.linesFrom(n, G.DIAGONAL).some((path) => {
      const seq = [n, ...path];
      for (let i = 1; i < seq.length; i++) { const a = seq[i - 1], b = seq[i]; if ((a === 'Q7' && b === 'R18') || (a === 'R18' && b === 'Q7') || (a === 'Q1' && b === 'R12') || (a === 'R12' && b === 'Q1')) return true; }
      return false;
    }));
    add(4, 'No diagonal move crosses a tip (Q7 to R18 or Q1 to R12)', allDiag);
    { const s = R.emptyGame(); s.board[R.IDX.B9] = { t: 'B', c: 'w' }; s.board[R.IDX.R11] = { t: 'P', c: 'b' }; s.board[R.IDX.R7] = { t: 'P', c: 'w' };
      const t = G.sortCells([...R.Patterns.DIAG_LINE(R.IDX.B9, s.board, 'w')].map((i) => R.NAMES[i])).join(' ');
      add(4, 'DIAG_LINE stops at first occupied cell (captures enemy, not friend)', t === 'Q8 Q10 Q18 N8 N10 R11', t); }

    // ---------- Phase 5 ----------
    const pawnTests = [
      ['w', 'Q6', true, 'Q7 Q8', 'B7'], ['w', 'R3', true, 'R2 R1', 'N2'], ['w', 'B7', false, 'B8', 'N8 Q8'], ['w', 'Q8', false, 'Q9 R18', 'B9 N18'],
      ['w', 'B9', false, 'B10 Q9', 'N10 Q10 Q8'], ['w', 'R11', false, 'R12 N11', 'N10 N12'], ['w', 'Q10', false, 'Q11 B18', 'B11 N18 Q18'],
      ['w', 'B12', false, 'B13', 'N13 Q13'], ['w', 'N17', false, 'N16', 'B16 R16'], ['b', 'R14', true, 'R13 R12', 'N13'],
      ['b', 'N17', true, 'N18 Q9', 'B18 R18'], ['b', 'B9', false, 'B8 N9', 'N10 N8 Q8'], ['b', 'Q1', false, 'Q2', 'B2']];
    for (const [c, cell, first, adv, cap] of pawnTests) {
      const s = R.emptyGame(), i = R.IDX[cell];
      s.board[i] = { t: 'P', c, moved: !first };
      const a = sortJoin([...R.Patterns.RUNNER(i, s.board, c, first)].map((x) => R.NAMES[x]));
      const ca = sortJoin(R.PAWN[c][i].caps.map((x) => R.NAMES[x]));
      add(5, `${c === 'w' ? 'White' : 'Black'} pawn ${cell}${first ? ', first move' : ''}`, a === sortJoin(adv.split(' ')) && ca === sortJoin(cap.split(' ')), `advances ${a}; captures ${ca}`);
    }
    const g = R.newGame();
    const wm = R.legalMoves(g, 'w'), bm = R.legalMoves(g, 'b');
    add(5, 'White has exactly 20 legal first moves', wm.length === 20, `${wm.length}`);
    add(5, 'Black has exactly 20 legal first moves', bm.length === 20, `${bm.length}`);
    const mv = (list, from) => sortJoin(list.filter((m) => R.NAMES[m.from] === from).map((m) => R.NAMES[m.to]));
    add(5, 'Knight N4 goes to B2 or R2; knight N5 to B7 or R7', mv(wm, 'N4') === 'B2 R2' && mv(wm, 'N5') === 'B7 R7');
    add(5, 'King, queen, rooks and bishops have no first moves', ['Q4', 'Q5', 'R4', 'R5', 'B4', 'B5'].every((c) => mv(wm, c) === ''));
    { const put = (s, n, t, c) => { s.board[R.IDX[n]] = { t, c, moved: false }; };
      const sw = R.emptyGame(); put(sw, 'Q4', 'K', 'w'); put(sw, 'R4', 'R', 'w'); put(sw, 'R5', 'R', 'w'); put(sw, 'B16', 'K', 'b');
      const wc = R.legalMoves(sw, 'w').filter((m) => m.castle);
      let ok = wc.length === 1 && R.NAMES[wc[0].to] === 'N4';
      if (ok) { R.makeMove(sw, wc[0]); ok = sw.board[R.IDX.B4] && sw.board[R.IDX.B4].t === 'R' && !sw.board[R.IDX.R4] && sw.board[R.IDX.N4].t === 'K'; }
      const sb = R.emptyGame(); put(sb, 'R14', 'K', 'b'); put(sb, 'Q14', 'R', 'b'); put(sb, 'Q15', 'R', 'b'); put(sb, 'B5', 'K', 'w');
      const bc = R.legalMoves(sb, 'b').filter((m) => m.castle);
      ok = ok && bc.length === 1 && R.NAMES[bc[0].to] === 'B14';
      if (ok) { R.makeMove(sb, bc[0]); ok = sb.board[R.IDX.N14] && sb.board[R.IDX.N14].t === 'R' && !sb.board[R.IDX.Q14] && sb.board[R.IDX.B14].t === 'K'; }
      add(5, 'Castling: Q4 to N4 with R4 to B4; R14 to B14 with Q14 to N14 (queen-side rook cannot castle)', ok); }
    { const s = R.emptyGame(); s.board[R.IDX.Q4] = { t: 'K', c: 'w', moved: false }; s.board[R.IDX.R4] = { t: 'R', c: 'w', moved: false }; s.board[R.IDX.R15] = { t: 'K', c: 'b', moved: false }; s.board[R.IDX.B6] = { t: 'R', c: 'b', moved: true };
      add(5, 'No castling through an attacked cell (B4 attacked)', !R.legalMoves(s, 'w').some((m) => m.castle)); }
    { const s = R.emptyGame(); s.board[R.IDX.B14] = { t: 'P', c: 'w', moved: true }; s.board[R.IDX.Q4] = { t: 'K', c: 'w', moved: true }; s.board[R.IDX.R13] = { t: 'K', c: 'b', moved: true };
      const ms = R.legalMoves(s, 'w').filter((m) => R.NAMES[m.from] === 'B14');
      add(5, 'White pawn reaching a 15 cell promotes (Q, R, B or N)', ms.length === 4 && ms.every((m) => R.NAMES[m.to] === 'B15' && m.promo)); }
    return res;
  }

  function selfPlay(games, depth, onProgress, done) {
    let g = 0, bad = 0; const results = {};
    function one() {
      const s = R.newGame(); let res = 'move cap (300 plies)';
      for (let ply = 0; ply < 300; ply++) {
        const st = R.status(s); if (st.over) { res = st.result; break; }
        const m = AI.chooseMove(s, depth);
        const legal = st.moves.some((x) => x.from === m.from && x.to === m.to && x.promo === m.promo && !!x.castle === !!m.castle);
        const tgt = s.board[m.to];
        if (!legal || (tgt && tgt.t === 'K')) { bad++; break; }
        R.playMove(s, m);
        if (R.findKing(s, 'w') < 0 || R.findKing(s, 'b') < 0) { bad++; break; }
      }
      results[res] = (results[res] || 0) + 1;
      g++; onProgress(g);
      if (g < games) setTimeout(one, 0); else done(bad, results);
    }
    setTimeout(() => { try { one(); } catch (e) { done(-1, { error: String(e) }); } }, 0);
  }

  return { syncTests, selfPlay, lineModeLines };
})();

  const canvas = $('board'), ctx = canvas.getContext('2d');

  const st = {
    game: R.newGame(), selected: null, targets: [], flipped: false, showNames: false,
    vsComputer: false, humanColor: 'w', depth: 2, thinking: false, status: null, promo: null, anim: null,
  };

  // ---------- coordinate transforms ----------
  let view = { ox: 0, oy: 0, sc: 1, dpr: 1 };
  const MARGIN = 0.25;
  function resize() {
    const wrap = canvas.parentElement;
    canvas.style.width = '0px'; canvas.style.height = '0px';   // measure the container, not the old canvas
    const cssW = wrap.clientWidth;
    const maxH = Math.max(260, window.innerHeight - 70);
    const aspect = (Ge.BOARD_H + 2 * MARGIN) / (Ge.BOARD_W + 2 * MARGIN);
    let w = cssW, h = w * aspect;
    if (h > maxH && window.innerWidth > 860) { h = maxH; w = h / aspect; }
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    view = { ox: w / 2, oy: h / 2, sc: w / (Ge.BOARD_W + 2 * MARGIN), dpr };
    draw();
  }
  function toScreen(p) {
    const x = st.flipped ? -p.x : p.x, y = st.flipped ? -p.y : p.y;
    return { x: view.ox + x * view.sc, y: view.oy - y * view.sc };
  }
  function fromScreen(sx, sy) {
    let x = (sx - view.ox) / view.sc, y = (view.oy - sy) / view.sc;
    if (st.flipped) { x = -x; y = -y; }
    return { x, y };
  }
  function pathPoly(pts) {
    ctx.beginPath();
    pts.forEach((p, i) => { const s = toScreen(p); i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); });
    ctx.closePath();
  }
  function circlePts(c, r, a1 = 0, a2 = 360, n = 96) {
    const pts = [];
    for (let i = 0; i <= n; i++) { const a = (a1 + (a2 - a1) * i / n) * Math.PI / 180; pts.push({ x: c.x + r * Math.cos(a), y: c.y + r * Math.sin(a) }); }
    return pts;
  }
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  // ---------- drawing ----------
  function fillCell(name, color) { pathPoly(POLY[name]); ctx.fillStyle = color; ctx.fill(); }
  function strokeCell(name, color, w) { pathPoly(POLY[name]); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke(); }
  function dotAt(name, color, rFrac) {
    const s = toScreen(LABEL[name]); ctx.beginPath();
    ctx.arc(s.x, s.y, SIZE[name] * view.sc * rFrac, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
  }

  function draw() {
    const C = {
      light: cssVar('--cell-light'), dark: cssVar('--cell-dark'), bg: cssVar('--surface'), rim: cssVar('--rim'),
      accent: cssVar('--accent'), check: cssVar('--danger'), last: cssVar('--last'), label: cssVar('--label'),
    };
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // all 72 cells
    for (const n of G.ALL_CELLS) { fillCell(n, Ge.shade(n) ? C.dark : C.light); strokeCell(n, 'rgba(128,128,128,0.35)', 0.6); }

    // overlays (drawn before the holes so the holes trim them too)
    const h = st.game.history[st.game.history.length - 1];
    if (h) { fillCell(R.NAMES[h.undo.m.from], C.last); fillCell(R.NAMES[h.undo.m.to], C.last); }
    if (st.status && st.status.check) { const k = R.findKing(st.game, st.game.turn); if (k >= 0) fillCell(R.NAMES[k], C.check); }
    if (st.selected != null) fillCell(R.NAMES[st.selected], C.accent + '99');

    // the two holes, drawn on top in the background colour
    for (const c of [Ge.CL, Ge.CR]) { pathPoly(Ge.holePoints(c)); ctx.fillStyle = C.bg; ctx.fill(); }
    // outer outline of the figure-8
    pathPoly([...circlePts(Ge.CL, Ge.R4, 45, 315), ...circlePts(Ge.CR, Ge.R4, 225, 495)]);
    ctx.strokeStyle = C.rim; ctx.lineWidth = 1.2; ctx.stroke();

    // legal targets
    for (const m of st.targets) {
      const n = R.NAMES[m.to];
      if (st.game.board[m.to]) strokeCell(n, C.accent, 3.5); else dotAt(n, C.accent, 0.17);
    }

    if (st.anim) {
      // mid-move: draw the position from before the move, with the moving piece(s) in flight
      const a = st.anim, skip = new Set(a.movers.map((x) => x.from));
      a.before.forEach((p, i) => { if (p && !skip.has(i)) drawPiece(R.NAMES[i], p); });
      const e = a.t < 0.5 ? 4 * a.t ** 3 : 1 - (-2 * a.t + 2) ** 3 / 2;
      for (const mv of a.movers) {
        const A = LABEL[R.NAMES[mv.from]], B = LABEL[R.NAMES[mv.to]];
        drawPieceAt({ x: A.x + (B.x - A.x) * e, y: A.y + (B.y - A.y) * e }, mv.piece);
      }
    } else st.game.board.forEach((p, i) => { if (p) drawPiece(R.NAMES[i], p); });

    // cell names: one size everywhere, like the reference board
    if (st.showNames) {
      const px = Math.max(8, 0.2 * view.sc);
      for (const n of G.ALL_CELLS) {
        const s = toScreen(LABEL[n]);
        const occupied = st.game.board[R.IDX[n]];
        ctx.font = `500 ${occupied ? px * 0.85 : px}px ${cssVar('--font')}`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = C.label;
        ctx.fillText(n, s.x, s.y + (occupied ? SIZE[n] * view.sc * 0.4 : 0));
      }
    }
  }
  function drawPiece(name, p) { drawPieceAt(LABEL[name], p); }
  function drawPieceAt(pt, p) {
    const s = toScreen(pt), px = PIECE_UNITS * view.sc;   // one size for every piece on every cell
    ctx.font = `${px}px ${PIECE_FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const g = GLYPH[p.t] + VS, y = s.y + px * 0.04;
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(1.5, px * 0.075);
    ctx.strokeStyle = p.c === 'w' ? '#1a1d1b' : '#efe8d6';
    ctx.strokeText(g, s.x, y);
    ctx.fillStyle = p.c === 'w' ? '#fbf7ee' : '#1f2421';
    ctx.fillText(g, s.x, y);
  }

  // ---------- play logic ----------
  const aiColor = () => (st.humanColor === 'w' ? 'b' : 'w');
  const sideName = (c) => (c === 'w' ? 'White' : 'Black');
  function refreshStatus() { st.status = R.status(st.game); }

  function clickPlay(name) {
    if (st.thinking || st.promo || st.anim || st.status.over) return;
    if (st.vsComputer && st.game.turn !== st.humanColor) return;
    const i = R.IDX[name];
    if (st.selected != null) {
      const hits = st.targets.filter((m) => m.to === i);
      if (hits.length) {
        if (hits.some((m) => m.promo)) { st.promo = hits; showPromo(true); return; }
        commit(hits[0]); return;
      }
    }
    const p = st.game.board[i];
    if (p && p.c === st.game.turn) {
      if (st.selected === i) { st.selected = null; st.targets = []; }
      else { st.selected = i; st.targets = st.status.moves.filter((m) => m.from === i && (!m.promo || m.promo === 'Q')).concat(st.status.moves.filter((m) => m.from === i && m.promo && m.promo !== 'Q')); }
    } else { st.selected = null; st.targets = []; }
    draw();
  }
  const ANIM_DELAY = 90, ANIM_MS = 360;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  function commit(m) {
    const before = st.game.board.slice();
    R.playMove(st.game, m);
    st.selected = null; st.targets = []; st.promo = null;
    // every piece that changed cell (king and rook when castling); a promoting pawn flies as a pawn
    const after = st.game.board, movers = [];
    before.forEach((p, i) => { if (!p) return; const j = after.indexOf(p); if (j >= 0 && j !== i) movers.push({ piece: p, from: i, to: j }); });
    if (m.promo) movers.push({ piece: before[m.from], from: m.from, to: m.to });
    const finish = () => { st.anim = null; refreshStatus(); render(); maybeAI(); };
    if (reduceMotion.matches || !movers.length) { finish(); return; }
    const token = {};
    st.anim = { before, movers, t: 0, token };
    draw();
    const start = performance.now() + ANIM_DELAY;
    (function frame(now) {
      if (!st.anim || st.anim.token !== token) return;   // cancelled by New game
      st.anim.t = Math.max(0, Math.min(1, (now - start) / ANIM_MS));
      draw();
      if (st.anim.t < 1) requestAnimationFrame(frame); else finish();
    })(performance.now());
  }
  function maybeAI() {
    if (!st.vsComputer || st.status.over || st.game.turn !== aiColor()) return;
    st.thinking = true; render();
    setTimeout(() => {
      const m = AI.chooseMove(st.game, st.depth);
      st.thinking = false;
      if (m) commit(m); else render();
    }, 60);
  }

  function showPromo(open) {
    const dlg = $('promo');
    if (!open) { dlg.hidden = true; return; }
    const c = st.game.turn;
    dlg.querySelector('.promo-choices').innerHTML = ['Q', 'R', 'B', 'N'].map((t) =>
      `<button type="button" data-p="${t}" aria-label="Promote to ${NAME_OF[t]}"><span class="glyph ${c}">${GLYPH[t]}${VS}</span><span>${NAME_OF[t][0].toUpperCase() + NAME_OF[t].slice(1)}</span></button>`).join('');
    dlg.hidden = false;
    dlg.querySelector('button').focus();
  }
  $('promo').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-p]');
    if (b && st.promo) { const m = st.promo.find((x) => x.promo === b.dataset.p); showPromo(false); commit(m); }
    if (e.target.id === 'promo-cancel') { st.promo = null; showPromo(false); draw(); }
  });

  // ---------- sidebar rendering ----------
  function render() {
    renderPlay();
    draw();
  }
  function renderPlay() {
    const s = st.status, g = st.game;
    let msg, sub = '';
    if (s.over) {
      if (s.result === 'checkmate') { msg = `Checkmate. ${sideName(s.winner)} wins.`; }
      else if (s.result === 'stalemate') { msg = 'Stalemate. The game is a draw.'; }
      else { msg = 'Draw by threefold repetition.'; }
      sub = 'Start a new game or undo to keep playing.';
    } else {
      msg = `${sideName(g.turn)} to move`;
      if (s.check) sub = `${sideName(g.turn)} is in check.`;
      if (st.thinking) sub = 'Thinking\u2026';
    }
    $('status').textContent = msg;
    $('status-sub').textContent = sub;
    $('status-sub').classList.toggle('alert', !!s.check && !s.over);
    $('turn-chip').className = 'chip ' + (s.over ? 'over' : g.turn);
    // move list
    const h = g.history, rows = [];
    for (let i = 0; i < h.length; i += 2) rows.push(`<li><span>${h[i].note}</span><span>${h[i + 1] ? h[i + 1].note : ''}</span></li>`);
    const ol = $('moves'); ol.innerHTML = rows.join('') || '';
    $('moves-empty').hidden = h.length > 0;
    ol.scrollTop = ol.scrollHeight;
    // captured
    const cap = { w: [], b: [] };
    for (const e of h) if (e.captured) cap[e.color].push(e.captured);
    const ord = 'QRBNP';
    for (const c of ['w', 'b']) {
      const list = cap[c].sort((a, b) => ord.indexOf(a.t) - ord.indexOf(b.t)).map((p) => `<span class="glyph ${p.c}">${GLYPH[p.t]}${VS}</span>`).join('');
      $('cap-' + c).innerHTML = list || '<span class="muted">None yet</span>';
    }
    $('undo').disabled = !h.length || st.thinking;
    $('ai-opts').hidden = !st.vsComputer;
  }
  // ---------- input ----------
  canvas.addEventListener('click', (e) => {
    const r = canvas.getBoundingClientRect();
    const p = fromScreen(e.clientX - r.left, e.clientY - r.top);
    const name = Ge.hitTest(p.x, p.y);
    if (name) clickPlay(name); else { st.selected = null; st.targets = []; draw(); }
  });
  canvas.addEventListener('mousemove', (e) => {
    const r = canvas.getBoundingClientRect();
    const p = fromScreen(e.clientX - r.left, e.clientY - r.top);
    const name = Ge.hitTest(p.x, p.y);
    $('hover').textContent = name || '';
    canvas.style.cursor = name ? 'pointer' : 'default';
  });
  canvas.addEventListener('mouseleave', () => ($('hover').textContent = ''));

  $('new-game').addEventListener('click', () => { st.anim = null; st.game = R.newGame(); st.selected = null; st.targets = []; st.thinking = false; refreshStatus(); render(); maybeAI(); });
  $('undo').addEventListener('click', () => {
    if (st.thinking || st.anim) return;
    R.undoLast(st.game);
    if (st.vsComputer && st.game.turn !== st.humanColor) R.undoLast(st.game);
    st.selected = null; st.targets = []; refreshStatus(); render();
  });
  $('flip').addEventListener('click', () => { st.flipped = !st.flipped; draw(); });
  $('names').addEventListener('change', (e) => { st.showNames = e.target.checked; draw(); });
  $('opponent').addEventListener('change', (e) => { st.vsComputer = e.target.value === 'computer'; render(); maybeAI(); });
  $('side').addEventListener('change', (e) => { st.humanColor = e.target.value; st.flipped = st.humanColor === 'b'; st.selected = null; st.targets = []; render(); maybeAI(); });
  $('depth').addEventListener('change', (e) => { st.depth = +e.target.value; });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (st.promo) { st.promo = null; showPromo(false); } st.selected = null; st.targets = []; draw(); } });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
  let rz = 0; window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(resize); });

  // ---------- #test runner ----------
  function runTests() {
    const panel = $('tests'); panel.hidden = false;
    const res = Tests.syncTests();
    const phases = { 1: 'Phase 1: board graph', 2: 'Phase 2: geometry and drawing', 3: 'Phase 3: neighbor and line checks', 4: 'Phase 4: movement patterns', 5: 'Phase 5: chess rules', 6: 'Phase 6: computer opponent' };
    const body = $('tests-body');
    let html = '';
    for (const ph of [1, 2, 3, 4, 5]) {
      const rs = res.filter((r) => r.phase === ph), ok = rs.filter((r) => r.pass).length;
      html += `<section><h3>${phases[ph]} <span class="${ok === rs.length ? 'pass' : 'fail'}">${ok}/${rs.length} passed</span></h3><ul>` +
        rs.map((r) => `<li class="${r.pass ? 'pass' : 'fail'}"><b>${r.pass ? 'PASS' : 'FAIL'}</b> ${r.name}${r.detail && !r.pass ? `<small>${r.detail}</small>` : r.detail && r.phase === 2 ? `<small>${r.detail}</small>` : ''}</li>`).join('') + '</ul></section>';
    }
    html += `<section><h3>${phases[6]}</h3><ul><li id="t6" class="pending"><b>RUNNING</b> 20 computer-vs-computer games at depth 1 <small id="t6p">0/20</small></li></ul></section>`;
    body.innerHTML = html;
    const total = res.length, passed = res.filter((r) => r.pass).length;
    $('tests-summary').textContent = `${passed} of ${total} checks passed. Running self-play\u2026`;
    Tests.selfPlay(20, 1, (g) => ($('t6p').textContent = `${g}/20`), (bad, results) => {
      const ok = bad === 0;
      const li = $('t6'); li.className = ok ? 'pass' : 'fail';
      li.innerHTML = `<b>${ok ? 'PASS' : 'FAIL'}</b> 20 games at depth 1 with no illegal move, crash, or captured king <small>${Object.entries(results).map(([k, v]) => `${v} ${k}`).join(', ')}</small>`;
      $('tests-summary').textContent = `${passed + (ok ? 1 : 0)} of ${total + 1} checks passed.`;
    });
  }
  function onHash() { if (location.hash === '#test') runTests(); else $('tests').hidden = true; }
  $('tests-close').addEventListener('click', () => { history.replaceState(null, '', location.pathname + location.search); $('tests').hidden = true; });
  window.addEventListener('hashchange', onHash);

  // ---------- fake loading screen ----------
  function runLoader(done) {
    const el = $('loader'), bar = $('loader-bar'), msg = $('loader-msg');
    const steps = [[18, 'Building the board'], [44, 'Joining the loops'], [71, 'Placing the pieces'], [92, 'Waking the computer'], [100, 'Ready']];
    let k = 0;
    (function next() {
      const [pct, text] = steps[k];
      bar.style.width = pct + '%'; msg.textContent = text; $('loader-track').setAttribute('aria-valuenow', pct);
      k++;
      if (k < steps.length) setTimeout(next, 280 + Math.random() * 220);
      else setTimeout(() => { el.classList.add('done'); setTimeout(() => { el.hidden = true; done(); }, 350); }, 300);
    })();
  }

  refreshStatus(); render(); resize();
  runLoader(() => { resize(); onHash(); });
  if (document.fonts) document.fonts.ready.then(draw);
})();

</script>
</body>
</html>
